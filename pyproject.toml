# automatic-funicular — Phase 2 tooling
[project]
name = "automatic-funicular"
version = "0.2.0"
description = "Open-source small-model weight hosting middleware (Phase 2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "jsonschema>=4.20",
  "jinja2>=3.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "redis>=5.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
]
contracts = [
  "pydantic>=2.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["control-plane", "gateway", "scripts", "packages"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
