# Model presets for small-model hosting (Phase 0 placeholders).
# backend: ollama (local) | vllm (prod)
# quant: recommended quantization hint (not enforced yet)
# min_vram_gb: rough lower bound for scheduling / capacity checks

version: 1

presets:
  - id: small-7b
    display_name: "7B Instruct"
    params_b: 7
    backend: ollama
    quant: q4_K_M
    min_vram_gb: 6
    notes: "Default local starter; Ollama tag TBD in Phase 1."

  - id: mid-14b
    display_name: "14B Instruct"
    params_b: 14
    backend: ollama
    quant: q4_K_M
    min_vram_gb: 10
    notes: "Balanced quality/VRAM for single-tenant local boxes."

  - id: large-27b
    display_name: "27B Instruct"
    params_b: 27
    backend: ollama
    quant: q4_K_M
    min_vram_gb: 18
    notes: "Higher quality; prefer sleep-on-idle."

  - id: large-32b
    display_name: "32B Instruct"
    params_b: 32
    backend: vllm
    quant: awq
    min_vram_gb: 24
    notes: "Production-oriented; vLLM preferred over Ollama."

  - id: small-7b-vllm
    display_name: "7B Instruct (vLLM)"
    params_b: 7
    backend: vllm
    quant: awq
    min_vram_gb: 8
    notes: "Same size class as small-7b, prod backend."

  - id: mid-14b-vllm
    display_name: "14B Instruct (vLLM)"
    params_b: 14
    backend: vllm
    quant: awq
    min_vram_gb: 14
    notes: "Prod mid-size preset."

defaults:
  local_backend: ollama
  prod_backend: vllm
  sleep_idle_seconds: 900
